name: Build Kasir Nominal V4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/kasir-v4
          unzip -o KasirNominal_Versi4_Build.zip -d /tmp/kasir-v4
          cp -R /tmp/kasir-v4/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirNominal-V4
          path: app/build/outputs/apk/debug/app-debug.apk
